name: inumi

services:
  # --- Control plane -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inumi
      POSTGRES_PASSWORD: inumi
      POSTGRES_DB: inumi_control
    ports:
      - "5432:5432"
    volumes:
      - inumi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inumi -d inumi_control"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Sample "dummy" databases the agent can be pointed at ---------------
  # A ready-to-use PostgreSQL target so `docker compose up` gives a working
  # real-connection demo out of the box. Point config/dev_credentials.yaml's
  # `analytics-postgres-prod` entry at host `postgres-sample` (from a
  # container) or `localhost:5435` (from the host).
  postgres-sample:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev_readonly
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: sample_analytics
    ports:
      - "5435:5432"
    volumes:
      - ./scripts/seed_postgres_sample.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_readonly -d sample_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in (heavy: ~1.5GB image, ~2GB RAM). Start with:
  #   docker compose --profile mssql up
  mssql-sample:
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng_Passw0rd!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - ./scripts/seed_sqlserver_sample.sql:/seed/seed.sql:ro

  # Opt-in. Start with:  docker compose --profile mysql up -d mysql-sample
  mysql-sample:
    profiles: ["mysql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: sample_app
      MYSQL_USER: inumi_diag
      MYSQL_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - ./scripts/seed_mysql_sample.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchange-me-root"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opt-in. Start with:  docker compose --profile mariadb up -d mariadb-sample
  mariadb-sample:
    profiles: ["mariadb"]
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: change-me-root
      MARIADB_DATABASE: sample_app
      MARIADB_USER: inumi_diag
      MARIADB_PASSWORD: change-me
    ports:
      - "3307:3306"
    volumes:
      - ./scripts/seed_mysql_sample.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services ----------------------------------------------
  migrate:
    build:
      context: .
    command: ["sh", "-c", "alembic upgrade head"]
    environment: &common-env
      INUMI_ENV: development
      CONTROL_DB_URL: postgresql+asyncpg://inumi:inumi@postgres:5432/inumi_control
      REDIS_URL: redis://redis:6379/0
      SECRETS_PROVIDER: local_dev
      IDENTITY_PROVIDER: mock
      POLICY_CONFIG_PATH: /app/config/policy.yaml
      SERVERS_CONFIG_PATH: /app/config/servers.yaml
      IDENTITY_CONFIG_PATH: /app/config/identity.yaml
      RATE_LIMIT_CONFIG_PATH: /app/config/rate_limits.yaml
      SERVICE_JWT_SECRET: dev-only-change-me-in-production
      SERVICE_JWT_ISSUER: inumi-internal
      GATEWAY_BASE_URL: http://gateway:8001
      EXECUTION_BASE_URL: http://execution:8002
      AGENT_BASE_URL: http://agent:8000
      # LLM: keys are passed through from your shell environment. With none
      # set, the agent falls back to the deterministic offline planner.
      # `LLM_PROVIDER` unset/"" = auto-pick the first provider that has a key.
      LLM_PROVIDER: "${LLM_PROVIDER:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy

  execution:
    build:
      context: .
      args:
        SERVICE: execution
    environment:
      <<: *common-env
    ports:
      - "8002:8002"
    # Lets the execution container reach databases running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      <<: *common-env
    ports:
      - "8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      execution:
        condition: service_started

  agent:
    build:
      context: .
      args:
        SERVICE: agent
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      - gateway

  channels:
    build:
      context: .
      args:
        SERVICE: channels
    environment:
      <<: *common-env
      SLACK_SIGNING_SECRET: "${SLACK_SIGNING_SECRET:-}"
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:-}"
      TEAMS_APP_ID: "${TEAMS_APP_ID:-}"
      TEAMS_APP_PASSWORD: "${TEAMS_APP_PASSWORD:-dev-teams-shared-token}"
    ports:
      - "8003:8003"
    depends_on:
      - agent

volumes:
  inumi-postgres-data:
