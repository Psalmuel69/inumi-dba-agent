# =============================================================================
# Database inventory (spec §11).
#
# The Gateway's TargetValidator resolves every DatabaseTarget the Agent
# proposes against exactly this list. Nothing outside this file can ever
# become a valid execution target — the LLM cannot invent a host, instance,
# or connection string.
#
# Fake data only. Fictitious "CoreBanking" example mirrors the walkthrough in
# the design spec (§54/§68) for local development and demos.
# =============================================================================

databases:
  - id: sqlserver-dev-01
    platform: sqlserver
    environment: development
    organization: platform-eng
    instance: sqlserver-dev-01
    cluster: ""
    database_name: SampleDev
    region: local
    criticality: low
    classification: internal
    owner: platform-eng
    support_team: platform-eng
    maintenance_window:
      timezone: Africa/Lagos
      start: "00:00"
      end: "23:59"
    allowed_roles: [DBA_L1, DBA_L2, DBA_L3, DBA_MANAGER]
    status: active

