# =============================================================================
# Template for config/dev_credentials.yaml (which is git-ignored).
#
#   cp config/dev_credentials.example.yaml config/dev_credentials.yaml
#
# Then fill in the connection details for your local / dummy databases. Read
# only when SECRETS_PROVIDER=local_dev. Every `id` here must match an entry in
# config/inventory.yaml. Fake, non-routable values only in this template.
#
# Optional per-entry `options`:
#   SQL Server:  trust_server_certificate: true   # dev servers w/ self-signed certs
#                encrypt: false                    # (default true)
#                driver: "ODBC Driver 17 for SQL Server"
#   PostgreSQL:  sslmode: require
# =============================================================================

credentials:
  sqlserver-dev-01:
    host: localhost
    port: 1433
    username: dev_readonly
    password: change-me
    database: SampleDev
    options: { trust_server_certificate: true }

  sqlserver-uat-01:
    host: localhost
    port: 1434
    username: dev_readonly
    password: change-me
    database: SampleUAT

  corebanking-dev-01:
    host: localhost
    port: 1433
    username: dev_readonly
    password: change-me
    database: SampleCoreBanking

  corebanking-prd-01:
    host: localhost
    port: 1433
    username: dev_readonly
    password: change-me
    database: SampleCoreBanking

  postgres-dev-01:
    host: localhost
    port: 5433
    username: dev_readonly
    password: change-me
    database: sample_dev

  postgres-uat-01:
    host: localhost
    port: 5434
    username: dev_readonly
    password: change-me
    database: sample_uat

  postgres-prod-cluster-01:
    host: localhost
    port: 5435
    username: dev_readonly
    password: change-me
    database: sample_analytics
