# =============================================================================
# Template for config/dev_credentials.yaml (which is git-ignored).
#
#   cp config/dev_credentials.example.yaml config/dev_credentials.yaml
#
# Keyed by SERVER id (must match an entry in config/servers.yaml).
# `database` is the bootstrap/default database the connection opens against
# (master / postgres); Inumi connects to specific discovered databases as
# needed. Read only when SECRETS_PROVIDER=local_dev.
#
# The login should be least-privilege for diagnostics — VIEW SERVER STATE +
# VIEW DEFINITION on SQL Server, the pg_monitor role on PostgreSQL — and
# should NOT have SELECT on user tables (Inumi never reads table data).
#
# Optional per-entry `options`:
#   SQL Server:  trust_server_certificate: true   # dev servers w/ self-signed certs
#                encrypt: false
#                driver: "ODBC Driver 17 for SQL Server"
#   PostgreSQL:  sslmode: require
#
# Fake, non-routable values only in this template.
# =============================================================================

credentials:
  sqlserver-dev-01:
    host: localhost
    port: 1433
    username: inumi_diag
    password: change-me
    database: master
    options: { trust_server_certificate: true }

  sqlserver-uat-01:
    host: localhost
    port: 1434
    username: inumi_diag
    password: change-me
    database: master
    options: { trust_server_certificate: true }

  corebanking-sqlserver-prod:
    host: localhost
    port: 1433
    username: inumi_diag
    password: change-me
    database: master
    options: { trust_server_certificate: true }

  postgres-dev-01:
    host: localhost
    port: 5433
    username: inumi_diag
    password: change-me
    database: postgres

  postgres-uat-01:
    host: localhost
    port: 5434
    username: inumi_diag
    password: change-me
    database: postgres

  analytics-postgres-prod:
    host: localhost
    port: 5435
    username: inumi_diag
    password: change-me
    database: postgres
