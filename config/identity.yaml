# =============================================================================
# Identity / authorization mapping (spec §3).
#
# This file NEVER contains real employees. It maps *enterprise identity
# provider groups* to application roles. In production this is backed by a
# real OIDC/AAD/Okta provider; the `directory` section below only exists to
# drive the local mock IdentityProvider for development and tests.
#
# Testing against a real channel (e.g. your own real Slack workspace) with
# your own real account: do NOT add yourself here. Instead create
# config/local_identity.yaml (gitignored, see
# config/local_identity.example.yaml for the template) — MockIdentityProvider
# automatically merges its mock_directory entries into this file's, so your
# real email/Slack id/etc. never reaches version control.
# =============================================================================

identity:
  # Any user who is a member of one of these groups is considered part of
  # the DBA team and may invoke @Inumi at all. Group membership alone does
  # NOT grant any tool access — role mapping below determines that.
  groups:
    dba_team:
      - "Enterprise-DBA"

  roles:
    DBA_L1:
      groups:
        - "Enterprise-DBA-L1"
    DBA_L2:
      groups:
        - "Enterprise-DBA-L2"
    DBA_L3:
      groups:
        - "Enterprise-DBA-L3"
    DBA_MANAGER:
      groups:
        - "Enterprise-DBA-Managers"

# -----------------------------------------------------------------------------
# Mock directory — DEVELOPMENT / TEST ONLY.
#
# Maps a channel account (e.g. a Slack user id, or a Teams AAD object id) to
# a synthetic enterprise identity + group memberships. The real
# `OIDCIdentityProvider` never reads this section; it authenticates against
# a real IdP instead. Fictitious users only.
# -----------------------------------------------------------------------------
mock_directory:
  - subject_id: "dev-sub-l1-001"
    email: "dba.l1@example.test"
    display_name: "Dev DBA L1"
    channel_accounts:
      slack: "U_MOCK_L1"
      teams: "aad-mock-l1"
      dev: "dba_l1@example.com"
    groups: ["Enterprise-DBA", "Enterprise-DBA-L1"]
    mfa_satisfied: true

  - subject_id: "dev-sub-l2-002"
