# =============================================================================
# Policy Engine configuration (spec §12).
#
# The PolicyEngine ALWAYS fails closed: any (environment, tool, role) triple
# not explicitly listed below evaluates to DENY (see
# gateway.domain.policy_engine.PolicyEngine.default_decision). Nothing here
# is interpreted, generated, or modified by the LLM — this file is loaded by
# the Gateway process only.
#
# Decisions: ALLOW | DENY | REQUIRES_APPROVAL
# =============================================================================

