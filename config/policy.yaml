# Tools requiring a change ticket in production regardless of role (spec §41).
change_ticket_required:
  production:
    - database.create_index
    - database.rebuild_index
    - database.modify_configuration
    - database.restart_instance
    - database.failover

# Tools requiring two-person (dual) approval regardless of role (spec §17).
dual_approval_required:
  - database.restart_instance
  - database.failover
