[project]
name = "inumi-dba-agent"
version = "0.1.0"
description = "Inumi: Enterprise AI DBA Agent & Secure DBA Control Gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "python-ulid>=2.7.0",
  "structlog>=24.1.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "sqlglot>=25.0.0",
  "anthropic>=0.34.0",
  "cryptography>=42.0.0",
  "itsdangerous>=2.2.0",
  "PyJWT[crypto]>=2.8.0",
]

[project.optional-dependencies]
db-drivers = [
  "pyodbc>=5.1.0",
  "psycopg[binary,pool]>=3.1.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
