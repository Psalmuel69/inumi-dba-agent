[project]
name = "inumi-dba-agent"
version = "0.1.0"
description = "Inumi: Enterprise AI DBA Agent & Secure DBA Control Gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "aiosqlite>=0.20.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.1",
  "python-ulid>=2.7.0",
  "structlog>=24.1.0",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "sqlglot>=25.0.0",
  "cryptography>=42.0.0",
  "itsdangerous>=2.2.0",
  "PyJWT[crypto]>=2.8.0",
  # Database drivers — the Execution Service always uses real connections.
  "pyodbc>=5.1.0",
  "psycopg[binary,pool]>=3.1.0",
  "asyncmy>=0.2.9",  # MySQL + MariaDB
  # LLM provider SDKs (spec §34). Each is only imported when that provider
  # is actually selected; a missing key simply makes the provider
  # unavailable rather than an import error.
  "anthropic>=0.39.0",
  "openai>=1.40.0",
  "google-genai>=1.0.0",
]

[project.optional-dependencies]
# Kept as an alias so existing `pip install -e ".[db-drivers]"` invocations
# still work; the drivers are now part of the base install.
db-drivers = []
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
  "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in a default argument is the framework's
# documented dependency-injection idiom, not a real "mutable default" bug.
# UP042: keeping `class X(str, Enum)` rather than `StrEnum` — these enums are
# used directly as Pydantic model fields / JSON schema sources across many
# modules, and standardizing that is a separate, deliberate refactor, not a
# lint fixup.
ignore = ["B008", "UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
